<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="shortcut icon" href="../imgs/logo.png">  
</head>
<body>
    
    <div class="navi">
        <button class="botao">Página Inicial</button>
        <button class="botao">Quem Somos?</button>
        <button class="btn">Cadastre-se</button>
        <img src="../imgs/logo2.png" class="logo"/>
    </div>
    
    <div class="container">
        <div class="form-image">
            <img src="IMAGEM1.PNG" alt="">
        </div>
        
        <div class="form">
            <form action="#">
                <div class="form-header">
                    <div class="title">
                        <h1>Login</h1>
                    </div>
                </div>
                <div class="login">
                    <div class="input-box">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="Digite seu Email" required onchange="onChangeEmail()" class="inEmail" autocomplete="email"/>
                        <div class="error" id="email-invalid-error">Email é obrigatório</div>
                        <div class="error" id="email-required-error">Email é inválido</div>
                    </div>

                    <div class="input-box">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required onchange="onChangePassword()" class="inPassword" autocomplete="current-password"/>
                    </div>
                    <div class="continue-button">
                        <button class="btn-continue" id="login-button">Entrar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    
        const firebaseConfig = {
            apiKey: "AIzaSyC4sOr19t2jtvGyUvdaCkylzpGUDb6BV1g",
            authDomain: "autenticacao-tcc.firebaseapp.com",
            projectId: "autenticacao-tcc",
            storageBucket: "autenticacao-tcc.appspot.com",
            messagingSenderId: "868086135648",
            appId: "1:868086135648:web:d2e9abcd7b0a5428723c05"
        };
    
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector('form');
    
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
    
                const email = document.getElementById('email').value;
                const senha = document.getElementById('password').value;
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, senha);
                    const user = userCredential.user;
    
                    console.log('Usuário autenticado com sucesso:', user);
                } catch (error) {
                    console.error('Erro ao autenticar usuário:', error.message);
                }
            });

            const loginButton = document.getElementById('login-button');
            loginButton.addEventListener('click', () => {
                window.location.href = "../cadastro/cadastro.html";
            });
        });
    </script>
</body>
</html>
