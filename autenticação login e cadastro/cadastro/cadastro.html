<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="../style/style2.css">
</head>
<body>

    <div class="navi">
        <button class="botao">Página Inicial</button>
        <button class="botao">Quem Somos?</button>
      <button class="btn" onclick="cadastro()">Cadastre-se</button>
      <img src="../imgs/logo2.png" class="logo"/>

    </div>

    <div class="container">
        <div class="form-image">
            <img src="../cadastro/IMAGEM-NORMAL.jpg" alt="">
        </div>
        <div class="form">
            <form action="">
                <div class="form-header">
                    <div class="title">
                    <h1>Cadastre-se</h1>
                    </div>
                    <div class="login-button">
                        <button> <a href="../login/login.html">Entrar</a></button>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-box">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required>
                    </div>
                    <div class="input-box">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu Sobrenome" required>
                    </div>

                    <div class="input-box">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu Email" required>
                    </div>

                    <div class="input-box">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                    </div>

                    <div class="input-box">
                        <label for="telefone">Número para Contato</label>
                        <input type="number" id="telefone" name="telefone" placeholder="(11) _____-____" required>
                    </div>

                    <div class="input-box">
                        <label for="cep">CEP</label>
                        <input type="number" inputmode="numeric" id="cep" name="cep" placeholder="______-___" required>
                    </div>

                    <div class="input-box">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua"  required>
                    </div>

                    <div class="gender-inputs">
                        <div class="gender-title">
                            <h6>Eu Sou:</h6>
                        </div>

                        <div class="gender-input">
                            <input type="radio" id="voluntario" name="gender" value="voluntario">
                            <label for="voluntario">Voluntário</label>
                        </div>
                        <div class="gender-input">
                            <input type="radio" id="empresa" name="gender" value="empresa">
                            <label for="empresa">Empresa Parceira</label>
                        </div>
                    </div>
                </div>

                <div class="continue-button">
                    <button id="continue-button">Continuar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        
        const firebaseConfig = {
          apiKey: "AIzaSyC4sOr19t2jtvGyUvdaCkylzpGUDb6BV1g",
          authDomain: "autenticacao-tcc.firebaseapp.com",
          projectId: "autenticacao-tcc",
          storageBucket: "autenticacao-tcc.appspot.com",
          messagingSenderId: "868086135648",
          appId: "1:868086135648:web:d2e9abcd7b0a5428723c05"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
    
        const form = document.querySelector('form');
    
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
    
            const nome = document.getElementById('nome').value;
            const sobrenome = document.getElementById('sobrenome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const telefone = document.getElementById('telefone').value;
            const cep = document.getElementById('cep').value;
            const rua = document.getElementById('rua').value;
            const genero = document.querySelector('input[name="gender"]:checked').value;
    
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                const user = userCredential.user;
    
                console.log('Usuário cadastrado com sucesso:', user);
                // Aqui você pode redirecionar o usuário para a próxima página ou realizar outras ações
            } catch (error) {
                console.error('Erro ao cadastrar usuário:', error.message);
            }
        });
    </script>

</body>
</html>
