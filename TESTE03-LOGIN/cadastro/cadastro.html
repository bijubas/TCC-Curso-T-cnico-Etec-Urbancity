<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="../style/style2.css">
</head>
<body>

    <div class="navi">
        <button class="botao">Página Inicial</button>
        <button class="botao">Quem Somos?</button>
      <button class="btn" onclick="cadastro()">Cadastre-se</button>
      <img src="../imgs/logo2.png" class="logo"/>

    </div>


    <div class="container">
        <div class="form-image">
            <img src="../cadastro/IMAGEM-NORMAL.jpg" alt="">
        </div>
        <div class="form">
            <form action="">
                <div class="form-header">
                    <div class="title">
                    <h1>Cadastre-se</h1>
                    </div>
                    <div class="login-button">
                        <button> <a href="">Entrar</a></button>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-box">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required>
                    </div>
                    <div class="input-box">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu Sobrenome" required>
                    </div>

                    <div class="input-box">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu Email" required>
                    </div>

                    <div class="input-box">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                    </div>

                    <div class="input-box">
                        <label for="telefone">Número para Contato</label>
                        <input type="number" id="telefone" name="telefone" placeholder="(11) _____-____" required>
                    </div>

                    <div class="input-box">
                        <label for="cep">CEP</label>
                        <input type="number" inputmode="numeric" id="cep" name="cep" placeholder="______-___" required>
                    </div>

                    <div class="input-box">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua"  required>
                    </div>

                    <div class="gender-inputs">
                        <div class="gender-title">
                            <h6>Eu Sou:</h6>
                        </div>

                        <div class="gender-group">
                            <div class="gender-input">
                                <input type="radio" id="voluntario" name="gender">
                                <label for="voluntario">Voluntário</label>
                            </div>
                            <div class="gender-input">
                                <input type="radio" id="empresa" name="gender">
                                <label for="empresa">Empresa Parceira</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="continue-button">
                    <button>Continuar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
